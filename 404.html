<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTS Connect</title>
  <style>
    body {
      margin: 0;
      background: #0B0E17;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Outfit', Arial, sans-serif;
      color: #fff;
    }

    .msg {
      text-align: center;
    }

    .logo {
      font-size: 60px;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
    }
  </style>
  <script>
    // Redirect to the app root (works on any host)
    var base = window.location.origin + '/';
    window.location.replace(base);
  </script>
</head>

<body>
  <div class="msg">
    <img src="logo-silver.png?v=13" alt="MTS Logo" style="width: 72px; height: 72px; object-fit: contain; margin-bottom: 16px;">
    <h2>MTS Connect</h2>
    <p>Loading app...</p>
  </div>
</body>

</html>
